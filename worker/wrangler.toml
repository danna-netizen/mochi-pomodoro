name = "mochi-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Milliseconds the page waits before asking for the message.
DELAY_MS = "20000"

# Secrets, set with `npx wrangler secret put <NAME>` (never commit them):
#   MESSAGE      the text shown in the corner
#   SIGNING_KEY  any long random string
